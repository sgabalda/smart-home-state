services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  mqtt-broker-mdns:
    image: flungo/avahi:latest
    restart: unless-stopped
    network_mode: host
    depends_on:
      - mosquitto
    environment:
      SERVER_HOST_NAME: mqtt-broker
      SERVER_DOMAIN_NAME: local
      SERVER_ENABLE_DBUS: "no"
      PUBLISH_PUBLISH_ADDRESSES: "yes"
    cap_add:
      - NET_ADMIN
      - NET_RAW

  smart-home-state:
    image: ghcr.io/sgabalda/smart-home-state:${SHS_VERSION:-stable}
    container_name: smart-home-state
    restart: unless-stopped

    environment:
      - JAVA_OPTS=-Xmx256m -Xms256m -XX:+UseG1GC -XX:+UseContainerSupport

    env_file:
      - .env

    # Volumes for persistent data
    volumes:
      - ./data:/app/data # Application data (state.json only)
      - ./logs:/app/logs # Application logs
      - /etc/localtime:/etc/localtime:ro # Sync timezone with host

    # Network configuration
    network_mode: host # Use host networking for easier MQTT/OpenHAB access

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

    # Resource limits for Raspberry Pi 3B+
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 384M

    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  frontend:
    image: ghcr.io/sgabalda/smart-home-state-frontend:${SHS_VERSION:-stable}
    container_name: smart-home-state-frontend
    restart: unless-stopped
    network_mode: host
    depends_on:
      smart-home-state:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_NOTIFICATION_URL=${NOTIFICATION_EMAIL_URL:-}
      - WATCHTOWER_NOTIFICATIONS_DELAY=2
      - WATCHTOWER_NOTIFICATION_TITLE_TAG=${NOTIFICATION_EMAIL_SUBJECT_TAG:-[Smart Home]}
    volumes:
      - ${DOCKER_SOCKET_LOCATION}docker.sock:/var/run/docker.sock

networks:
  default:
    name: smart-home-network
