name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA to deploy"
        required: true
        default: "main"
        type: string
      reason:
        description: "Reason for manual deployment (e.g., rollback, hotfix)"
        required: false
        default: "Manual deployment"
        type: string

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}
  FRONTEND_IMAGE: ${{ github.repository }}-frontend

jobs:
  manual-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: ref-type
        env:
          DEPLOY_REF: ${{ github.event.inputs.ref }}
        run: |
          if git ls-remote --exit-code --refs origin "refs/tags/$DEPLOY_REF" >/dev/null; then
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
            echo "tag=$DEPLOY_REF" >> "$GITHUB_OUTPUT"
          else
            safe_ref=$(printf '%s' "$DEPLOY_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g' | sed -E 's/^[.-]+|[.-]+$//g' | cut -c1-80)
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            echo "tag=manual-${safe_ref}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        if: steps.ref-type.outputs.is_tag != 'true'
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.ref-type.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        if: steps.ref-type.outputs.is_tag != 'true'
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.ref-type.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Promote matching images to stable
        env:
          IMAGE_TAG: ${{ steps.ref-type.outputs.tag }}
        run: |
          docker buildx imagetools inspect "${REGISTRY}/${BACKEND_IMAGE}:${IMAGE_TAG}" >/dev/null
          docker buildx imagetools inspect "${REGISTRY}/${FRONTEND_IMAGE}:${IMAGE_TAG}" >/dev/null
          docker buildx imagetools create \
            --tag "${REGISTRY}/${BACKEND_IMAGE}:stable" \
            "${REGISTRY}/${BACKEND_IMAGE}:${IMAGE_TAG}"
          docker buildx imagetools create \
            --tag "${REGISTRY}/${FRONTEND_IMAGE}:stable" \
            "${REGISTRY}/${FRONTEND_IMAGE}:${IMAGE_TAG}"

      - name: Summary
        env:
          DEPLOY_REF: ${{ github.event.inputs.ref }}
          DEPLOY_REASON: ${{ github.event.inputs.reason }}
          IMAGE_TAG: ${{ steps.ref-type.outputs.tag }}
        run: |
          if [ "${{ steps.ref-type.outputs.is_tag }}" = "true" ]; then
            echo "Promoted existing images for release tag $DEPLOY_REF"
          else
            echo "Built and promoted matching images from ref $DEPLOY_REF"
          fi
          echo "Reason: $DEPLOY_REASON"
          echo "  - ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:stable (source $IMAGE_TAG)"
          echo "  - ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:stable (source $IMAGE_TAG)"
          echo "Watchtower will deploy the updated stable images."
