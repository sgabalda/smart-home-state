name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect Docker build changes
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      docker: ${{ steps.filter.outputs.docker }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check Docker build files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            docker:
              - 'build.sbt'
              - 'project/plugins.sbt'
              - 'project/build.properties'
              - 'Dockerfile'

  test:
    name: Format, Compile and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup SBT
        uses: sbt/setup-sbt@v1

      - name: Cache SBT dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            ~/.coursier/cache
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', '**/project/**') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Check code formatting
        run: sbt ";scalafmtSbtCheck;scalafmtCheckAll"

      - name: Check compilation
        run: sbt compile

      - name: Run tests
        run: sbt test

  firmware:
    name: Compile Arduino Uno firmware
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python for clang-format
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install clang-format
        run: python -m pip install clang-format==18.1.8

      - name: Check Arduino formatting
        run: find firmware -type f -name '*.ino' -exec clang-format --dry-run --Werror --style=file {} +

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.1.1

      - name: Install Arduino AVR platform
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.6

      - name: Install Arduino libraries
        run: |
          arduino-cli lib install \
            Ethernet@2.0.2 \
            PubSubClient@2.8.0 \
            OneWire@2.3.8 \
            DallasTemperature@4.0.6 \
            PZEM004Tv30@1.2.1

      - name: Compile all Arduino Uno sketches
        run: |
          shopt -s nullglob
          sketches=(firmware/arduino/uno/*/)
          if (( ${#sketches[@]} == 0 )); then
            echo "No Arduino Uno sketches found" >&2
            exit 1
          fi
          for sketch in "${sketches[@]}"; do
            arduino-cli compile --fqbn arduino:avr:uno "$sketch"
          done

  docker:
    name: Build and run Docker image
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build multi-platform Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker image for smoke test
        run: docker build --tag smart-home-state:ci .

      - name: Run Docker image
        run: |
          set -euo pipefail

          container_name=smart-home-state-ci
          cleanup() {
            docker logs "$container_name" || true
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name "$container_name" smart-home-state:ci
          running=$(docker inspect --format '{{.State.Running}}' "$container_name")
          test "$running" = true
          docker stop "$container_name"
